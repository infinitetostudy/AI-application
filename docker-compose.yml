services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["rag"]
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
